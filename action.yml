name: Translation Sync
description: Syncs PHP translation files on release branches with a catalog branch, and opens a pull request for each branch that's out of date.
inputs:
  catalog-branch:
    description: Branch that holds translation-sync.yml and the catalog.
    default: translations
  token:
    description: Token used to push branches and open pull requests. Pull requests opened with the default GITHUB_TOKEN don't trigger other workflows.
    default: ${{ github.token }}
  dry-run:
    description: Report what would change without committing, pushing, or opening pull requests.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.catalog-branch }}
        token: ${{ inputs.token }}
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        coverage: none
    - shell: bash
      run: composer install --no-dev --no-interaction --no-progress --working-dir="$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        args=(sync --fetch)
        if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
        php "$GITHUB_ACTION_PATH/bin/translation-sync" "${args[@]}"
