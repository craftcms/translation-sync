name: Translation Sync
description: Syncs PHP translation files on release branches with a catalog branch, and opens a pull request for each branch that's out of date.
inputs:
  catalog-branch:
    description: Branch that holds translation-sync.yml and the catalog.
    default: translations
  token:
    description: Token used to push branches and open pull requests. Pull requests opened with the default GITHUB_TOKEN don't trigger other workflows.
    default: ${{ github.token }}
  git-user-name:
    description: Name for the sync's commits.
    default: github-actions[bot]
  git-user-email:
    description: Email for the sync's commits. Use the noreply email of the account that opens the pull requests, so squash-merged sync pull requests aren't mistaken for translation edits.
    default: 41898282+github-actions[bot]@users.noreply.github.com
  dry-run:
    description: Report what would change without committing, pushing, or opening pull requests.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.catalog-branch }}
        token: ${{ inputs.token }}
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        coverage: none
    - shell: bash
      run: composer install --no-dev --no-interaction --no-progress --working-dir="$GITHUB_ACTION_PATH"
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DRY_RUN: ${{ inputs.dry-run }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        args=(sync --fetch)
        if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
        php "$GITHUB_ACTION_PATH/bin/translation-sync" "${args[@]}"
